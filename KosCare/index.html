<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F6670">
<title>KosCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: panel presentasi di kiri (desktop) + bingkai HP di kanan. Di layar HP, aplikasi memenuhi layar.
   Bahasa visual mengikuti logo: bentuk datar, kontur teal tua yang tebal, bayangan solid "stiker". */
:root{
  /* palet dari logo */
  --teal:#3AA3A9; --deep:#1F6670; --ink:#0F3A41; --sun:#FBDA66; --amber:#E29101;
  /* permukaan & teks */
  --page:#CBE6E7; --page-dot:#B6D9DB; --bg:#E8F4F4; --surface:#FFFFFF; --surface2:#F1F8F8;
  --text:#0F3A41; --muted:#47707A; --line:#CBE3E4; --outline:#1F6670; --frame:#0E2B31;
  --hero:#1F6670; --hero-text:#FFFFFF; --hero-muted:#BFE3E5;
  --sel-bg:#1F6670; --sel-fg:#FFFFFF;
  --sun-soft:#FFF1BE; --amber-soft:#FBE2B0; --teal-soft:#CDEBEC; --aqua-soft:#DDF3F4;
  --ok:#1F8A5B; --ok-soft:#D6F1E3; --warn:#B86E00; --bad:#C2412D; --bad-soft:#FBE0DA;
  --fd:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --fb:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#061519; --page-dot:#0B2227; --bg:#0A2226; --surface:#102F35; --surface2:#143A41;
    --text:#E4F5F5; --muted:#92BCC1; --line:#1F4B53; --outline:#4DAAB1; --frame:#020A0C;
    --hero:#0F4046; --hero-text:#FFFFFF; --hero-muted:#A9D5D8;
    --sel-bg:#FBDA66; --sel-fg:#0F3A41;
    --sun-soft:#3B3716; --amber-soft:#40300F; --teal-soft:#16484E; --aqua-soft:#16404A;
    --ok:#5BD39B; --ok-soft:#12392B; --warn:#F0B34A; --bad:#FF8E78; --bad-soft:#401E19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#061519; --page-dot:#0B2227; --bg:#0A2226; --surface:#102F35; --surface2:#143A41;
  --text:#E4F5F5; --muted:#92BCC1; --line:#1F4B53; --outline:#4DAAB1; --frame:#020A0C;
  --hero:#0F4046; --hero-text:#FFFFFF; --hero-muted:#A9D5D8;
  --sel-bg:#FBDA66; --sel-fg:#0F3A41;
  --sun-soft:#3B3716; --amber-soft:#40300F; --teal-soft:#16484E; --aqua-soft:#16404A;
  --ok:#5BD39B; --ok-soft:#12392B; --warn:#F0B34A; --bad:#FF8E78; --bad-soft:#401E19;
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page);
  background-image:radial-gradient(var(--page-dot) 1.4px,transparent 1.5px);
  background-size:22px 22px;
  color:var(--text);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
.num{font-variant-numeric:tabular-nums}

/* ====== STAGE ====== */
.stage{height:100%;max-width:1120px;margin:0 auto;padding:20px 32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:center;grid-template-rows:minmax(0,100%)}
.panel{min-width:0;max-height:100%;overflow:auto;padding:8px 4px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:72px;height:72px;border-radius:18px;display:block;box-shadow:0 4px 0 var(--outline)}
.brand h1{font:800 44px/1 var(--fd);letter-spacing:-.02em;color:var(--text)}
.brand p{color:var(--muted);font-weight:600;margin-top:4px}
.lead{font-size:15px;color:var(--muted);max-width:46ch}
.lead b{color:var(--text)}
.feat-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);transition:transform .15s,border-color .15s}
.feat:hover{transform:translateY(-2px);border-color:var(--outline)}
.feat .ico{width:36px;height:36px;border-radius:12px;background:var(--sun);color:var(--ink);display:grid;place-items:center;border:2px solid var(--outline);flex:none}
.feat b{display:block;font:700 14px/1.25 var(--fd)}
.feat span{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.panel-actions{display:flex;gap:10px;flex-wrap:wrap}
.pill-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:2px solid var(--outline);background:var(--surface);font-weight:700;font-size:13px}
.pill-btn:hover{background:var(--sun);color:var(--ink)}
.src{font-size:12px;color:var(--muted);max-width:52ch}

/* ====== PHONE ====== */
.phone{width:392px;height:min(852px,100%);max-height:100%;min-height:0;border-radius:50px;border:10px solid var(--frame);background:var(--bg);overflow:hidden;overflow:clip;position:relative;box-shadow:0 30px 60px -20px rgba(6,40,46,.45),0 0 0 2px var(--outline)}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.statusbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-weight:700;font-size:12.5px;color:var(--hero-text);background:var(--hero);transition:background .2s,color .2s}
.statusbar.light{background:var(--bg);color:var(--text)}
.statusbar .si{display:flex;gap:6px;align-items:center}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.view::-webkit-scrollbar{display:none}
.screen{min-height:100%;display:flex;flex-direction:column;animation:enter .32s cubic-bezier(.2,.8,.2,1) both;will-change:transform,opacity}
.screen.none{will-change:auto}
.screen.back{animation-name:enterback}
.screen.fade{animation-name:fadein}
.screen.none{animation:none}
@keyframes enter{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes enterback{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1.5px solid var(--line)}
.app.notabs .tabbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:16px;font-size:11px;font-weight:700;color:var(--muted);position:relative;border:2px solid transparent}
.tab[aria-current="page"]{background:var(--sun);color:var(--ink);border-color:var(--outline);box-shadow:0 3px 0 var(--outline)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

/* ====== COMMON ====== */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg)}
.topbar h2{font:700 18px/1.2 var(--fd);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:14px;border:2px solid var(--outline);background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:0 2px 0 var(--outline)}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.pad{padding:0 16px}
.sec{padding:20px 16px 0;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h3{font:700 18px/1.2 var(--fd)}
.sec-h a,.sec-h button{font-size:12.5px;font-weight:700;color:var(--deep)}
:root[data-theme="dark"] .sec-h a,:root[data-theme="dark"] .sec-h button{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec-h a,:root:not([data-theme="light"]) .sec-h button{color:var(--sun)}}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:17px;border:2px solid var(--outline);background:var(--sun);color:var(--ink);font:700 15px var(--fb);box-shadow:0 4px 0 var(--outline);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--outline)}
.btn.deep{background:var(--deep);color:#fff}
.btn.ghost{background:var(--surface);color:var(--text)}
.btn.sm{height:40px;font-size:13px;border-radius:13px;width:auto;padding:0 16px;box-shadow:0 3px 0 var(--outline)}
.btn[disabled]{opacity:.5;pointer-events:none}
.cta-bar{position:sticky;bottom:0;margin-top:auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1.5px solid var(--line);display:flex;align-items:center;gap:14px;z-index:4}
.cta-bar .tot{min-width:0}
.cta-bar .tot small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.cta-bar .tot b{font:800 20px/1.1 var(--fd)}
.cta-bar .btn{flex:1}

.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--sun);color:var(--ink);border:1.5px solid var(--outline);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.soft{background:var(--teal-soft);color:var(--text);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.chip[disabled]{opacity:.4;pointer-events:none;text-decoration:line-through}
.chip.slot{flex:1 1 28%;justify-content:center;font-variant-numeric:tabular-nums}

.tone-sun{--t:var(--sun);--t-soft:var(--sun-soft)}
.tone-amber{--t:var(--amber);--t-soft:var(--amber-soft)}
.tone-teal{--t:var(--teal);--t-soft:var(--teal-soft)}
.tone-aqua{--t:#9ED8DB;--t-soft:var(--aqua-soft)}
.tile{width:46px;height:46px;border-radius:15px;background:var(--t);border:2px solid var(--outline);display:grid;place-items:center;color:var(--ink);flex:none}
.tile.sm{width:40px;height:40px;border-radius:13px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.input{width:100%;min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:11px 14px;outline:none}
.input:focus{border-color:var(--outline);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 60%,transparent)}
textarea.input{resize:none;min-height:76px}
.input.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.errmsg{color:var(--bad);font-size:12px;font-weight:600}

.switch{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.switch[aria-checked="true"]{border-color:var(--outline);background:var(--teal-soft)}
.switch .tx{flex:1;min-width:0}
.switch .tx b{display:block;font-weight:700;font-size:14px}
.switch .tx span{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.sw{box-sizing:border-box;width:50px;height:30px;border-radius:999px;background:var(--line);border:2px solid var(--outline);position:relative;flex:none;display:block;transition:background .25s}
.sw::after{content:"";box-sizing:border-box;position:absolute;top:50%;left:3px;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--surface);border:2px solid var(--outline);transition:transform .28s cubic-bezier(.2,.9,.3,1.2),background .2s}
[aria-checked="true"]>.sw{background:var(--sun)}
[aria-checked="true"]>.sw::after{transform:translateX(20px);background:var(--deep);border-color:var(--outline)}

/* ====== HOME ====== */
.hero{background:var(--hero);color:var(--hero-text);padding:8px 16px 56px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero .gear{position:absolute;right:-34px;top:-30px;width:190px;height:190px;color:var(--teal);opacity:.55;animation:spin 40s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.loc{display:flex;align-items:center;gap:8px;min-width:0}
.loc small{display:block;font-size:11px;color:var(--hero-muted);font-weight:600;line-height:1.1}
.loc b{display:block;font-weight:700;font-size:14px;line-height:1.2}
.hero .icon-btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);box-shadow:none;position:relative}
.hero .icon-btn .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--sun);border:2px solid var(--hero)}
.hero h1{font:800 31px/1.08 var(--fd);letter-spacing:-.02em;margin-top:18px;max-width:11em;position:relative;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{color:var(--hero-muted);font-size:13px;margin-top:8px;position:relative;max-width:30ch}
.searchbox{margin:-26px 16px 0;position:relative;z-index:2;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:17px;background:var(--surface);border:2px solid var(--outline);box-shadow:0 4px 0 var(--outline);color:var(--muted);font-weight:500;width:calc(100% - 32px)}
.urgent{margin:16px 16px 0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--sun);color:var(--ink);border:2px solid var(--outline);box-shadow:0 4px 0 var(--outline);width:calc(100% - 32px)}
.urgent:active{transform:translateY(3px);box-shadow:0 1px 0 var(--outline)}
.urgent .tile{background:var(--amber);width:42px;height:42px}
.urgent b{display:block;font:800 15px/1.2 var(--fd)}
.urgent span{font-size:12px;font-weight:500;opacity:.85}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:var(--t-soft);border:2px solid var(--outline);box-shadow:0 4px 0 var(--outline);text-align:left;position:relative;transition:transform .08s,box-shadow .08s}
.svc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--outline)}
.svc b{font:800 18px/1.1 var(--fd)}
.svc .sub{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.svc .pr{font-size:12.5px;font-weight:700}
.svc .badge{position:absolute;top:10px;right:10px}
.promos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 8px;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.promo{flex:0 0 84%;scroll-snap-align:start;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--outline);text-align:left;min-height:150px;position:relative;overflow:hidden}
.promo h4{font:800 19px/1.15 var(--fd);max-width:12em}
.promo p{font-size:12.5px;max-width:25ch}
.promo .go{margin-top:auto;font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px}
.promo.p1{background:var(--sun);color:var(--ink)}
.promo.p2{background:var(--deep);color:#fff}
.promo.p2 .go{color:var(--sun)}
.promo.p3{background:var(--amber-soft);color:var(--text)}
.promo .bg-ic{position:absolute;right:-14px;bottom:-16px;width:104px;height:104px;opacity:.16;stroke-width:1.5}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.why>div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-size:12px;font-weight:700;line-height:1.25}
.why .tile{background:var(--teal-soft);border-color:transparent;color:var(--deep)}
.why small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;line-height:1.3;margin-bottom:6px}
.bar-top b{font:800 14px var(--fd);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:999px;background:var(--teal);transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1);will-change:transform}
.bar.hi i{background:var(--amber)}
.footnote{padding:22px 16px 26px;font-size:11.5px;color:var(--muted);text-align:center}

/* ====== CATALOG ====== */
.big-search{display:flex;align-items:center;gap:10px;margin:2px 16px 12px;padding:0 14px;height:48px;border-radius:15px;background:var(--surface);border:1.5px solid var(--line)}
.big-search:focus-within{border-color:var(--outline)}
.big-search input{flex:1;min-width:0;border:0;outline:0;background:none;height:100%}
.item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);width:100%;text-align:left;transition:border-color .15s,transform .1s}
.item:hover{border-color:var(--outline)}
.item:active{transform:scale(.99)}
.item b{display:block;font:700 15px/1.25 var(--fd)}
.item .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted);margin-top:3px}
.item .price{text-align:right;flex:none}
.item .price b{font:800 15px var(--fd);white-space:nowrap}
.item .price small{display:block;font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;padding:0 16px 20px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty .tile{margin:0 auto 12px;background:var(--teal-soft);border-color:transparent;color:var(--deep);width:60px;height:60px}

/* ====== DETAIL ====== */
.d-hero{background:var(--t);border-bottom:2px solid var(--outline);border-radius:0 0 30px 30px;padding:0 16px 24px;color:var(--ink);position:relative;overflow:hidden}
.d-hero .topbar{background:none;backdrop-filter:none;padding:10px 0;position:relative}
.d-hero .icon-btn{color:var(--ink);background:#fff}
.d-hero h1{font:800 28px/1.1 var(--fd);letter-spacing:-.02em;margin-top:6px;position:relative;text-wrap:balance}
.d-hero .big-ic{position:absolute;right:-20px;bottom:-26px;width:150px;height:150px;opacity:.22;stroke-width:1.4}
.d-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;position:relative}
.d-meta .badge{background:#fff;border-color:var(--ink)}
.price-line{display:flex;align-items:baseline;gap:8px;margin-top:14px;position:relative}
.price-line b{font:800 34px/1 var(--fd)}
.price-line span{font-weight:600;font-size:13px}
.chk{display:flex;flex-direction:column;gap:10px}
.chk li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.chk li .ic{color:var(--ok);margin-top:1px}
.chk.no li .ic{color:var(--warn)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--sun-soft);font-size:13px;line-height:1.45}
.note .ic{color:var(--warn);margin-top:1px}
.note.ok{background:var(--ok-soft)}.note.ok .ic{color:var(--ok)}
.stepper{display:flex;align-items:center;gap:6px;border:2px solid var(--outline);border-radius:14px;background:var(--surface);padding:3px}
.stepper button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sun);color:var(--ink)}
.stepper button:disabled{opacity:.4}
.stepper b{min-width:28px;text-align:center;font:800 16px var(--fd)}
.review{display:flex;gap:10px;padding:12px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--fd);color:#fff;flex:none}
.stars{display:inline-flex;gap:1px;color:var(--amber)}

/* ====== BOOKING ====== */
.bill{display:flex;flex-direction:column;gap:9px}
.bill>div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.bill .minus b{color:var(--ok)}
.bill .tot{padding-top:11px;border-top:2px dashed var(--line);font-size:15px}
.bill .tot b{font:800 20px var(--fd)}
.bill .dp{background:var(--teal-soft);border-radius:12px;padding:9px 12px;font-size:12.5px;align-items:center}
.upload{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:2px dashed var(--line);width:100%;background:var(--surface2);color:var(--muted);font-weight:600}
.upload img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.voucher{display:flex;gap:8px}
.voucher .input{text-transform:uppercase;flex:1;min-width:0}

/* ====== TRACK ====== */
.t-hero{background:var(--hero);color:var(--hero-text);padding:0 16px 20px;border-radius:0 0 28px 28px}
.t-hero .topbar{background:none;backdrop-filter:none;padding:10px 0}
.t-hero .topbar h2{color:#fff}
.t-hero .icon-btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);box-shadow:none}
.t-status{display:flex;align-items:center;gap:12px;margin-top:4px}
.t-status h1{font:800 24px/1.15 var(--fd);letter-spacing:-.01em;text-wrap:balance}
.t-status p{color:var(--hero-muted);font-size:13px;margin-top:2px}
.eta{flex:none;width:72px;height:72px;border-radius:50%;background:var(--sun);color:var(--ink);border:2px solid #fff;display:grid;place-items:center;text-align:center;line-height:1.05}
.eta b{display:block;font:800 22px var(--fd)}
.eta small{font-size:10px;font-weight:700}
.map{margin:14px 16px 0;border-radius:22px;overflow:hidden;border:2px solid var(--outline);background:var(--aqua-soft);position:relative;box-shadow:0 4px 0 var(--outline)}
.map svg{display:block;width:100%;height:auto}
.map .cap{position:absolute;left:10px;bottom:8px;font-size:10px;font-weight:700;background:var(--surface);border-radius:8px;padding:2px 8px;color:var(--muted)}
.tech{display:flex;flex-direction:column;gap:12px}
.tech .row{align-items:flex-start}
.tech h4{font:800 17px/1.2 var(--fd)}
.id-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.id-photo{width:64px;height:76px;border-radius:14px;border:2px solid var(--outline);overflow:hidden;flex:none;position:relative}
.id-photo svg{display:block;width:100%;height:100%}
.wa{border-radius:16px;background:var(--surface2);padding:10px 12px;font-size:12.5px;line-height:1.45;border:1.5px dashed var(--line)}
.wa b{font-weight:700}
.tl{display:flex;flex-direction:column}
.tl-i{display:flex;gap:14px;min-height:56px}
.tl-d{display:flex;flex-direction:column;align-items:center;flex:none}
.tl-d i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:#fff;flex:none}
.tl-d u{flex:1;width:2px;background:var(--line);margin:3px 0}
.tl-i.done .tl-d i{background:var(--teal);border-color:var(--deep)}
.tl-i.done .tl-d u{background:var(--teal)}
.tl-d i{position:relative}
.tl-i.cur .tl-d i{background:var(--amber);border-color:var(--outline)}
.tl-i.cur .tl-d i::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--amber);opacity:.5;animation:pulse 1.6s ease-out infinite;will-change:transform,opacity;z-index:-1}
@keyframes pulse{from{transform:scale(1);opacity:.5}to{transform:scale(2.2);opacity:0}}
.tl-t{padding-bottom:12px;min-width:0}
.tl-t b{display:block;font-weight:700;font-size:14px}
.tl-t span{font-size:12.5px;color:var(--muted)}
.tl-i:not(.done):not(.cur) .tl-t b{color:var(--muted);font-weight:600}
.demo-ctl{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--hero-muted)}
.demo-ctl button{height:28px;padding:0 10px;border-radius:999px;border:1.5px solid rgba(255,255,255,.5);color:#fff;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11.5px}

/* ====== ORDERS ====== */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:2px 16px 14px;padding:4px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.seg button{height:38px;border-radius:12px;font-weight:700;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.order{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line)}
.order .row b{font:700 15px/1.25 var(--fd);display:block}
.guard{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:12.5px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.guard.off{background:var(--surface2);color:var(--muted)}
.order-actions{display:flex;gap:8px}
.order-actions .btn{flex:1}

/* ====== PASS ====== */
.pass-card{margin:4px 16px 0;border-radius:26px;background:var(--sun);color:var(--ink);border:2px solid var(--outline);box-shadow:0 5px 0 var(--outline);padding:18px;position:relative;overflow:hidden}
.pass-card .gear2{position:absolute;right:-30px;top:-34px;width:170px;height:170px;color:var(--amber);opacity:.5}
.pass-card h1{font:800 30px/1 var(--fd);letter-spacing:-.02em;position:relative}
.pass-card .pp{display:flex;align-items:baseline;gap:6px;margin-top:14px;position:relative}
.pass-card .pp b{font:800 36px/1 var(--fd)}
.pass-card .pp span{font-weight:700;font-size:13px}
.pass-card .badge{background:#fff;position:relative;margin-bottom:8px}
.calc{display:flex;flex-direction:column;gap:12px}
.calc input[type=range]{width:100%;accent-color:var(--amber);height:28px}
.calc .res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc .res>div{padding:12px;border-radius:16px;background:var(--surface2);border:1.5px solid var(--line)}
.calc .res small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.calc .res b{font:800 20px var(--fd)}
.calc .res .win{background:var(--ok-soft);border-color:transparent}
.calc .res .win b{color:var(--ok)}

/* ====== PROFILE ====== */
.p-head{display:flex;align-items:center;gap:14px;padding:6px 16px 0}
.p-head .avatar{width:64px;height:64px;font-size:22px;background:var(--deep);border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline)}
.p-head h1{font:800 22px/1.15 var(--fd)}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.menu>*{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-bottom:1.5px solid var(--line)}
.menu>*:last-child{border-bottom:0}
.menu .mi{width:36px;height:36px;border-radius:12px;background:var(--teal-soft);color:var(--deep);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .menu .mi{color:var(--sun)}
.menu b{display:block;font-weight:700;font-size:14px}
.menu span.s{display:block;font-size:12px;color:var(--muted)}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;border:2px dashed var(--outline);background:var(--surface);font:800 17px var(--fd);letter-spacing:.06em}

/* ====== MITRA ====== */
.m-hero{background:var(--ink);color:#fff;padding:0 16px 22px;border-radius:0 0 28px 28px}
:root[data-theme="dark"] .m-hero{background:#031013}
.m-hero .topbar{background:none;backdrop-filter:none;padding:10px 0;position:static}
.m-hero .icon-btn{position:relative;background:transparent;color:#fff;border-color:rgba(255,255,255,.5);box-shadow:none}
.m-hero h1{font:800 22px/1.15 var(--fd)}
.m-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.m-stats>div{padding:12px;border-radius:16px;background:rgba(255,255,255,.09)}
.m-stats small{display:block;font-size:11px;color:var(--hero-muted);font-weight:600}
.m-stats b{font:800 22px var(--fd)}
.job{border-radius:22px;border:2px solid var(--outline);background:var(--surface);box-shadow:0 4px 0 var(--outline);padding:14px;display:flex;flex-direction:column;gap:12px}
.countdown{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.countdown i{display:block;height:100%;background:var(--amber);width:100%;transform-origin:left;animation:cd 45s linear forwards}
@keyframes cd{to{transform:scaleX(0)}}

/* ====== SHEET / TOAST ====== */
.scrim{position:absolute;inset:0;background:rgba(5,25,29,.58);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;border-top:2px solid var(--outline);padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.sheet.on{transform:none}
.sheet::before{content:"";width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center;flex:none}
.sheet h3{font:800 20px/1.2 var(--fd)}
.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:40;padding:12px 14px;border-radius:16px;background:var(--ink);color:#fff;font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;border:2px solid var(--outline);box-shadow:0 4px 0 var(--outline);opacity:0;transform:translateY(12px);pointer-events:none;transition:all .25s}
.toast.on{opacity:1;transform:none}
.toast .ic{color:var(--sun)}
.qr{width:200px;height:200px;margin:0 auto;padding:12px;background:#fff;border-radius:18px;border:2px solid var(--outline)}
.qr svg{display:block;width:100%;height:100%}
.chat{display:flex;flex-direction:column;gap:8px;max-height:260px;min-height:140px;overflow-y:auto;padding:4px 0}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.4}
.msg.them{background:var(--surface2);border:1.5px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--sun);color:var(--ink);border-bottom-right-radius:4px;align-self:flex-end}
.chat-in{display:flex;gap:8px}
.chat-in .input{flex:1;min-width:0}
.star-row{display:flex;justify-content:center;gap:6px}
.star-row button{color:var(--line)}
.star-row button.on{color:var(--amber)}
.star-row .ic{width:38px;height:38px}
.success{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.success .ok{width:68px;height:68px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.splash{position:absolute;inset:0;z-index:60;background:var(--teal);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
.splash.off{opacity:0;visibility:hidden}
.splash div{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--ink);text-align:center}
.splash img{width:112px;height:112px;border-radius:28px;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.splash b{font:800 34px var(--fd);letter-spacing:-.02em}
.splash span{font-weight:600}

/* ====== RESPONSIVE ====== */
@media (max-width:1020px){
  .stage{grid-template-columns:minmax(0,1fr) auto;gap:28px;padding:16px}
  .feat-list{grid-template-columns:1fr}
}
@media (max-width:860px){
  .stage{display:block;padding:0;max-width:none}
  .panel{display:none}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ====== transisi tema ====== */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
.theming,.theming *,.theming *::before,.theming *::after{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease,stroke .45s ease,box-shadow .45s ease!important}

/* ====== MODE DESKTOP ====== */
.app{background:var(--bg)}
.app.web{height:100%}
.app.web .statusbar{display:none}
.nav-brand,.nav-end{display:none}
.devseg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:999px;border:2px solid var(--outline);background:var(--surface)}
.devseg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.devseg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.chrome{display:none}
.plist{display:flex;flex-direction:column;gap:10px}

/* bingkai browser (presentasi) */
.stage[data-device="desk"]{max-width:1560px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px;padding:14px 24px;align-items:stretch}
.stage[data-device="desk"] .panel{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 18px;overflow:visible;padding:0}
.stage[data-device="desk"] .brand img{width:44px;height:44px;border-radius:12px}
.stage[data-device="desk"] .brand h1{font-size:26px}
.stage[data-device="desk"] .brand p,.stage[data-device="desk"] .lead,.stage[data-device="desk"] .src{display:none}
.stage[data-device="desk"] .panel-actions{order:2;margin-left:auto}
.stage[data-device="desk"] .feat-list{order:3;flex:0 0 100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;min-width:0}
.stage[data-device="desk"] .feat{padding:6px 12px 6px 8px;align-items:center;gap:8px;min-width:0;border-radius:14px}
.stage[data-device="desk"] .feat .ico{width:28px;height:28px;border-radius:9px}
.stage[data-device="desk"] .feat b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage[data-device="desk"] .feat>span:last-child{min-width:0}
@media (max-width:1300px){.stage[data-device="desk"] .feat-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stage[data-device="desk"] .feat span span{display:none}
.stage[data-device="desk"] .phone{width:100%;height:100%;border-radius:16px;border:2px solid var(--outline);display:flex;flex-direction:column;box-shadow:0 24px 50px -24px rgba(6,40,46,.5)}
.stage[data-device="desk"] .phone .app{flex:1;min-height:0;height:auto}
.stage[data-device="desk"] .chrome{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:var(--surface2);border-bottom:1.5px solid var(--line);flex:none}
.chrome i{width:11px;height:11px;border-radius:50%;display:block;opacity:.85}
.chrome .url{flex:1;max-width:420px;margin:0 auto;height:26px;border-radius:999px;background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}

/* tata letak desktop */
.app.desk{font-size:15px}
.app.desk .statusbar{display:none}
.app.desk .tabbar,.app.desk.notabs .tabbar{display:flex;align-items:center;gap:6px;order:-1;padding:10px 32px;border-top:0;border-bottom:1.5px solid var(--line);background:var(--surface);z-index:6}
.app.desk .nav-brand{display:flex;align-items:center;gap:10px;font:800 22px var(--fd);letter-spacing:-.02em;margin-right:24px;color:var(--text)}
.app.desk .nav-brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 2px 0 var(--outline)}
.app.desk .tab{flex-direction:row;gap:8px;padding:9px 18px;font-size:13.5px}
.app.desk .tab[aria-current="page"]{box-shadow:0 2px 0 var(--outline)}
.app.desk .tab .dot{position:static;margin-left:2px}
.app.desk .nav-end{display:flex;align-items:center;gap:10px;margin-left:auto}
.app.desk .nav-end .btn{width:auto}
.app.desk .screen{width:100%;max-width:1120px;margin:0 auto;padding:0 32px}
.app.desk .screen.scr-detail,.app.desk .screen.scr-book,.app.desk .screen.scr-track{max-width:1040px}
.app.desk .screen.scr-orders{max-width:920px}
.app.desk .screen.scr-profile,.app.desk .screen.scr-pass,.app.desk .screen.scr-mitra{max-width:680px}
.app.desk .topbar,.app.desk .cta-bar{padding-inline:0}
.app.desk .sec,.app.desk .p-head,.app.desk .big-search,.app.desk .seg{padding-inline:0}
.app.desk .big-search,.app.desk .seg,.app.desk .map,.app.desk .pass-card,.app.desk .searchbox,.app.desk .urgent{margin-inline:0}
.app.desk .searchbox,.app.desk .urgent{width:100%}
.app.desk .chips,.app.desk .promos,.app.desk .list{padding-inline:0}
.app.desk .sec-h h3{font-size:20px}
.app.desk :is(.hero,.t-hero,.d-hero,.m-hero){border-radius:28px;margin-top:16px;padding-inline:36px}
.app.desk .hero{padding-top:20px;padding-bottom:64px}
.app.desk .hero h1{font-size:44px;max-width:14em}
.app.desk .hero p{font-size:15px;max-width:44ch}
.app.desk .hero .gear{width:280px;height:280px;right:-30px;top:-50px}
.app.desk .hero [data-themebtn]{display:none}
.app.desk .svc-grid{grid-template-columns:repeat(4,1fr);gap:16px}
.app.desk .promos{overflow:visible}
.app.desk .promo{flex:1 1 0;min-width:0}
.app.desk .bars{display:grid;grid-template-columns:1fr 1fr;gap:20px 40px}
.app.desk .plist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.app.desk .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.app.desk .why{gap:14px}
.app.desk .footnote{padding-bottom:36px}
.app.desk .screen.scr-detail .plist{grid-template-columns:1fr}
.app.desk .screen.scr-orders .list{grid-template-columns:1fr 1fr}
/* layar dua kolom */
.app.desk .screen.scr-detail,.app.desk .screen.scr-book,.app.desk .screen.scr-track{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;align-content:start}
.app.desk .screen.scr-detail>header,.app.desk .screen.scr-track>header,.app.desk .screen.scr-book>.topbar,.app.desk .screen.scr-book>.sec:nth-child(2),.app.desk .screen.scr-detail>.cta-bar,.app.desk .screen.scr-book>.cta-bar,.app.desk .screen.scr-track>.cta-bar,.app.desk .screen.scr-detail>div:not([class]),.app.desk .screen.scr-book>div:not([class]),.app.desk .screen.scr-track>div:not([class]){grid-column:1/-1}
.app.desk .screen.scr-track .map{margin-top:20px;align-self:start}
.app.desk .screen.scr-book>.cta-bar,.app.desk .screen.scr-detail>.cta-bar,.app.desk .screen.scr-track>.cta-bar{border-radius:20px 20px 0 0;border:1.5px solid var(--line);border-bottom:0;padding-inline:20px}
/* sheet jadi modal */
.app.desk .sheet{top:50%;bottom:auto;left:50%;right:auto;width:min(480px,92%);max-height:88%;border-radius:28px;border:2px solid var(--outline);padding-top:22px;transform:translate(-50%,-46%) scale(.97);opacity:0;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility .28s}
.app.desk .sheet.on{transform:translate(-50%,-50%);opacity:1;visibility:visible}
.app.desk .sheet::before{display:none}
.app.desk .toast{left:50%;right:auto;width:min(440px,90%);bottom:28px;transform:translate(-50%,12px)}
.app.desk .toast.on{transform:translate(-50%,0)}
@media (hover:hover){
  .app.desk .svc:hover,.app.desk .promo:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--outline)}
  .app.desk .svc,.app.desk .promo{transition:transform .15s,box-shadow .15s}
  .app.desk .item:hover{transform:translateY(-2px)}
  .app.desk .tab:not([aria-current="page"]):hover{background:var(--teal-soft)}
  .btn:hover{filter:brightness(1.03)}
}

/* ====== animasi pindah mode Mobile <-> Desktop ====== */
.vt-device .phone{view-transition-name:kc-device}
html.vt-device::view-transition-group(kc-device){animation-duration:.7s;animation-timing-function:cubic-bezier(.65,0,.2,1)}
html.vt-device::view-transition-old(kc-device){animation:kc-fadeout .7s cubic-bezier(.65,0,.2,1) both;height:100%;object-fit:cover;object-position:top left}
html.vt-device::view-transition-new(kc-device){animation:kc-fadein .7s cubic-bezier(.65,0,.2,1) both;height:100%;object-fit:cover;object-position:top left}
html.vt-device::view-transition-old(root){animation:kc-fadeout .45s ease both;mix-blend-mode:normal}
html.vt-device::view-transition-new(root){animation:kc-fadein .45s ease both;mix-blend-mode:normal}
@keyframes kc-fadeout{0%{opacity:1}65%{opacity:0}100%{opacity:0}}
@keyframes kc-fadein{0%{opacity:0}20%{opacity:0}85%{opacity:1}100%{opacity:1}}
.phone.devswap{animation:devswap .55s cubic-bezier(.2,.8,.2,1)}
@keyframes devswap{from{opacity:.2;transform:scale(.94)}to{opacity:1;transform:none}}


/* chip fitur aktif */
.feat{position:relative}
.feat[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg);transform:translateY(-2px);box-shadow:0 4px 0 var(--outline)}
.feat[aria-pressed="true"] span,.feat[aria-pressed="true"] b{color:var(--sel-fg)}.feat[aria-pressed="true"] .ico{color:var(--ink)}
.feat[aria-pressed="true"] .ico{border-color:var(--outline)}
.feat[aria-pressed="true"]::after{content:"Sedang dibuka";position:absolute;top:-9px;right:10px;font:700 9.5px var(--fd);background:var(--amber);color:#fff;border-radius:99px;padding:1px 8px;letter-spacing:.02em}
/* notifikasi */
.nlist{display:flex;flex-direction:column;gap:10px;padding:4px 16px 24px}
.nitem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);position:relative;transition:transform .15s}
.nitem:active{transform:scale(.98)}
.nitem.unread{border-color:var(--outline);background:var(--teal-soft)}
.nitem.unread::after{content:"";position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.nitem b{display:block;font-size:14px;padding-right:16px}.nitem p{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}.nitem small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.nhead{display:flex;align-items:center;justify-content:space-between;padding:0 18px 6px;color:var(--muted);font-size:12px}
.nhead button{color:var(--deep);font-weight:700;font-size:12.5px}

/* level mitra & komisi */
.lvgrid{display:grid;gap:12px}.app.desk .lvgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.lvc{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:9px;position:relative}
.lvc.cur{border-color:var(--outline);background:var(--sun-soft);box-shadow:0 4px 0 var(--outline)}
.lvc .top{display:flex;align-items:center;gap:10px}.lvc .top b{display:block;font:700 15px var(--fd)}.lvc .top small{display:block;color:var(--muted);font-size:11px}
.lvc .pct{margin-left:auto;font:800 28px/1 var(--fd);text-align:right}.lvc .pct small{display:block;font:600 10px var(--fb,inherit);color:var(--muted)}
.lvc ul{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px}.lvc li{display:flex;gap:7px;align-items:flex-start;line-height:1.35}.lvc li svg{margin-top:2px;color:var(--deep)}
.lvc h5{font:700 11px var(--fd);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.lvc .take{background:var(--bg);border-radius:12px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:auto}.lvc .take b{font:700 15px var(--fd)}
.lvc .tag{position:absolute;top:-10px;right:14px;background:var(--amber);color:#fff;font:700 10px var(--fd);padding:2px 10px;border-radius:99px}
.mexp{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mexp p{font-size:13px;line-height:1.5}.mexp .why{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.4}.mexp .why .mi{width:32px;height:32px;border-radius:11px;background:var(--teal-soft);color:var(--deep);display:grid;place-items:center;flex:none}.mexp .why b{display:block;font-size:13px}
.mcheck{display:flex;gap:8px;flex-wrap:wrap}.mcheck span{display:inline-flex;align-items:center;gap:5px;background:var(--ok-soft,#d6f1e1);color:var(--deep);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700}
.mrule{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.45}.mrule b{display:block}
.app.desk .lvc .pct{font-size:22px}.app.desk .lvc .top b{font-size:14px}

/* login & mitra gate */
.app.authscr #tabbar{display:none!important}
.auth{display:flex;flex-direction:column;align-items:center;gap:16px;padding:34px 20px 30px;min-height:100%}
.auth-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.auth-top h1{font:800 24px/1.15 var(--fd)}.auth-top p{font-size:13px;color:var(--muted)}
.auth-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.app.desk .auth-card{background:var(--surface);border:2px solid var(--outline);border-radius:26px;padding:26px;box-shadow:0 6px 0 var(--outline)}
.auth-card .seg{margin:0}
.auth-card form{display:flex;flex-direction:column;gap:14px}
.pwrow{position:relative}.pwrow .input{padding-right:48px}
.pwrow .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.rowx{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lnk{color:var(--deep);font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.ckb{display:flex;flex-direction:row;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;cursor:pointer}
.ckb input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--outline);background:var(--surface);flex:none;display:grid;place-items:center;margin-top:-1px;cursor:pointer;transition:background .15s}
.ckb input::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);transition:transform .15s;margin-top:-2px}
.ckb input:checked{background:var(--sun)}.ckb input:checked::after{transform:rotate(45deg) scale(1)}
.ckb input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ckb input:disabled{opacity:.45;cursor:not-allowed}
.ckb b{font-weight:700}
.demo-box{display:flex;flex-direction:column;gap:6px;background:var(--sun-soft);border:1.5px dashed var(--amber);border-radius:16px;padding:12px 14px;font-size:12px}
.demo-box code{font:600 12px ui-monospace,Menlo,monospace;background:var(--surface);border-radius:8px;padding:4px 8px;word-break:break-all}
.demo-box .btn{height:42px;margin-top:4px;font-size:13px}
.mgate-hero{background:var(--ink);color:#fff;border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
:root[data-theme="dark"] .mgate-hero{background:#031013}
.mgate-hero h1{font:800 21px/1.2 var(--fd)}.mgate-hero p{font-size:12.5px;color:var(--hero-muted,#bfe3e6)}
.syarat{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13px}.syarat li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.syarat li .n{width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--ink);font:700 12px var(--fd);display:grid;place-items:center;flex:none;border:2px solid var(--outline)}
.cardx{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:11px}
.cardx h3{font:700 15px var(--fd)}
.stp{display:flex;align-items:center;gap:9px;font:700 14px var(--fd)}.stp i{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;display:grid;place-items:center;font-size:12px}
.doc{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:14px;border:1.5px dashed var(--line);background:var(--bg);text-align:left}
.doc.ok{border-style:solid;border-color:var(--outline);background:var(--teal-soft)}
.doc .mi{width:34px;height:34px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--deep);flex:none}
.doc b{display:block;font-size:13px}.doc span.s{display:block;font-size:11.5px;color:var(--muted)}.doc .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--deep);display:flex;align-items:center;gap:4px}
.sopbar{position:sticky;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;z-index:6}
.sopbar .row2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.sopbar .prog{height:5px;border-radius:5px;background:var(--line);overflow:hidden}.sopbar .prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .15s}
.sopbar small{font-size:11.5px;color:var(--muted);text-align:center}
.sopblk{border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--line);background:var(--surface)}
.sopblk h3{font:700 16px var(--fd);display:flex;align-items:center;gap:9px}
.sopblk.do{background:var(--teal-soft);border-color:var(--outline)}
.sopblk.dont{background:#FBE0DA;border-color:#C2412D}:root[data-theme="dark"] .sopblk.dont{background:#401E19}
.sopblk ol{padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.45}
.sanksi{display:flex;flex-direction:column;gap:8px}
.sx{border-radius:15px;background:var(--surface);border:1.5px solid var(--line);padding:11px 12px;display:grid;gap:4px;font-size:12.5px;line-height:1.4;border-left-width:6px}
.sx .t{display:flex;align-items:center;gap:8px;font:700 13.5px var(--fd)}
.sx .t em{font-style:normal;font-size:10.5px;background:var(--sun);color:var(--ink);padding:1px 9px;border-radius:99px;margin-left:auto}
.sx.l1{border-left-color:#E29101}.sx.l2{border-left-color:#D2691E}.sx.l3{border-left-color:#C2412D}.sx.l4{border-left-color:#7a1d12}
.sx b{font-weight:700}
.tl2{display:flex;flex-direction:column;gap:12px;margin:4px 0}.tl2 div{display:flex;gap:11px;align-items:flex-start;font-size:13px}.tl2 i{width:24px;height:24px;border-radius:50%;background:var(--sun);display:grid;place-items:center;flex:none;font:700 11px var(--fd);font-style:normal;border:2px solid var(--outline)}
.tl2 span{color:var(--muted);display:block;font-size:12px}
.actrow{display:flex;gap:10px;flex-wrap:wrap}.actrow .btn{flex:1;min-width:140px}
.ckb input:not(:checked)::after{opacity:0}
.item .meta>span:not(.badge){display:inline-flex;align-items:center;gap:5px;min-height:22px;line-height:1;font-weight:600}
.item .meta>span:not(.badge) .ic{width:15px;height:15px;flex:none;margin:0}
.item .meta{gap:5px 10px;margin-top:5px}

/* ===== Mitra notifikasi ===== */
.m-hero .icon-btn .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.mn-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.mn-tabs::-webkit-scrollbar{display:none}
.mn-tabs .chip b{font-size:11px;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--teal-soft);color:var(--text);padding:0 6px}
.mn-tabs .chip[aria-pressed="true"] b{background:rgba(255,255,255,.22);color:var(--sel-fg)}
.mn-list{display:flex;flex-direction:column;gap:10px;padding:0 16px 24px}
.mn-msg{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);position:relative}
.mn-msg.unread{border-color:var(--outline);background:var(--teal-soft)}
.mn-msg.unread::after,.mn-ord.unread::after{content:"";position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.mn-msg p{margin:2px 0 3px;font-size:13.5px;line-height:1.4}
.mn-msg small,.mn-ord small{color:var(--muted);font-size:11.5px}
.mn-ord{border-radius:18px;background:var(--surface);border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.mn-ord.unread{border-color:var(--outline)}
.mn-ord .hd{display:flex;gap:10px;align-items:flex-start;padding-right:16px}
.mn-ord .hd .grow{min-width:0}
.mn-ord .hd b{font:700 15px var(--fd);display:block}
.mn-ord .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.mn-ord .meta b{font-variant-numeric:tabular-nums}
.mn-empty{text-align:center;padding:36px 20px;color:var(--muted)}
.app.desk .mn-list{display:grid;grid-template-columns:repeat(2,1fr)}
.app.desk .mn-list>*{height:100%}
:root[data-theme="dark"] .nhead button{color:var(--sun)}
:root[data-theme="dark"] .mn-msg .tile,:root[data-theme="dark"] .mn-ord .tile{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nhead button{color:var(--sun)}:root:not([data-theme="light"]) .mn-msg .tile,:root:not([data-theme="light"]) .mn-ord .tile{color:var(--text)}}
.mn-msg .grow{min-width:0;display:flex;flex-direction:column;gap:2px}
.mn-msg .who{font:700 15px var(--fd)}
.mn-msg .ordl{font-size:12px;color:var(--muted)}
.mn-msg p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mn-msg small{margin-top:auto;padding-top:2px}
</style>

function appFee(sub){return sub<30000?2000:sub<60000?3500:5000}
function bill(){
  const it=item(S.itemId),sub=it.price*S.qty;
  const passOff=S.pass?Math.round(sub*.15):0;
  const fee=S.pass?0:appFee(sub);
  const vo=S.draft.voucher?VOUCH[S.draft.voucher].off:0;
  const vApplied=Math.min(vo,sub-passOff);
  const total=sub-passOff-vApplied+fee;
  return{sub,passOff,fee,vApplied,total,dp:5000,saveIfPass:appFee(sub)+Math.round(sub*.15)}
}
function slotAvail(day,s){if(day>0)return true;const d=new Date();return (+s.slice(0,2))*60>d.getHours()*60+d.getMinutes()+60}
function dayLabel(o){
  const d=new Date(Date.now()+o*DAY);
  const w=d.toLocaleDateString('id-ID',{weekday:'short'});
  return (o===0?'Hari ini':o===1?'Besok':w+', '+d.getDate()+' '+d.toLocaleDateString('id-ID',{month:'short'}));
}

/* ----- tracking ----- */
let T=null;
let raf=0,lastTs=0,lastEta='';
function loop(ts){
  if(!T){raf=0;return}
  const dt=lastTs?Math.min(100,ts-lastTs):0;lastTs=ts;
  if(T.auto&&T.stage<4){
    T.t+=dt;
    if(T.t>=DUR[T.stage])advance();
    else if(cur.name==='track'){
      placeMarker();
      const ev=etaView();if(ev!==lastEta){lastEta=ev;const e=$('#eta');if(e)e.innerHTML=ev}
    }
  }
  raf=requestAnimationFrame(loop);
}
function startTrack(o){
  T={o,stage:0,t:0,auto:true,t0:Date.now()};lastTs=0;lastEta='';
  if(!raf)raf=requestAnimationFrame(loop);
}
function stopTrack(){T=null;if(raf){cancelAnimationFrame(raf);raf=0}}
function advance(){
  if(!T||T.stage>=4)return;
  T.stage++;T.t=0;
  const tech=TECH[T.o.tech];
  if(T.stage===1){T.o.chat.push({w:'them',x:`Halo, saya ${tech.name.split(' ')[0]} ${tech.name.split(' ')[1]} dari KosCare. Saya siap menuju ${T.o.room.split('·')[0].trim()}.`});toast('Teknisi ditugaskan. Foto identitas dikirim ke pesan instanmu.','idcard')}
  if(T.stage===2)toast(`${tech.name} menuju kamarmu`,'truck');
  if(T.stage===3){T.o.chat.push({w:'them',x:'Saya sudah sampai dan mulai mengerjakan ya.'});toast('Pengerjaan dimulai','wrench')}
  if(T.stage===4)toast('Pekerjaan selesai. Cek hasilnya lalu beri nilai.','check');
  if(cur.name==='track')render('none',true);
  refreshTabs();
}
function etaView(){
  const o=T.o;
  if(T.stage<2)return o.urgent?`<b>≤2</b><small>JAM</small>`:`<b class="num">${o.slot}</b><small>JADWAL</small>`;
  if(T.stage===2){const m=Math.max(1,Math.ceil(12*(1-T.t/DUR[2])));return `<b class="num">${m}</b><small>MENIT</small>`}
  if(T.stage===3)return `${ic('wrench','lg')}<small>KERJA</small>`;
  return `${ic('check','lg')}<small>SELESAI</small>`;
}
function updateLive(){
  const e=$('#eta');if(e)e.innerHTML=etaView();
  placeMarker();
}
function placeMarker(){
  const route=$('#route'),m=$('#tmark');if(!route||!m||!T)return;
  const len=route._len||(route._len=route.getTotalLength());
  const p=T.stage<2?0:T.stage===2?Math.min(1,T.t/DUR[2]):1;
  const pt=route.getPointAtLength(len*p);
  m.setAttribute('transform',`translate(${pt.x} ${pt.y})`);
  const done=$('#routeDone');if(done)done.setAttribute('stroke-dasharray',`${len*p} ${len}`);
}

function qrSvg(){
  const n=25,cells=[];let seed=1234;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
  const finder=(x,y)=>x<8&&y<8||x>n-9&&y<8||x<8&&y>n-9;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(!finder(x,y)&&rnd()>.52)cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`)}
  const fp=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0F3A41"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0F3A41"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" aria-label="Kode QR simulasi"><g fill="#0F3A41">${cells.join('')}</g>${fp(0,0)}${fp(n-7,0)}${fp(0,n-7)}</svg>`;
}

function applyTheme(dark){
  const root=document.documentElement;
  S.dark=dark;root.dataset.theme=dark?'dark':'light';persist();
  const b=$('#btnTheme');if(b)b.innerHTML=ic(dark?'sun':'moon','sm')+'<span>'+(dark?'Mode terang':'Mode gelap')+'</span>';

function setTheme(){
  const root=document.documentElement,next=!isDark();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const done=()=>toast(next?'Mode gelap aktif':'Mode terang aktif',next?'moon':'sun');
  if(reduce){applyTheme(next);done();return}
  if(document.startViewTransition&&lastX!==null){
    const x=lastX,y=lastY,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    try{
      const t=document.startViewTransition(()=>applyTheme(next));
      t.ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:650,easing:'cubic-bezier(.45,0,.2,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
      t.finished.then(done,done);return;
    }catch(e){}
  }
  root.classList.add('theming');applyTheme(next);done();
  setTimeout(()=>root.classList.remove('theming'),600);
}

    root.classList.add('vt-device');
    let t;try{t=document.startViewTransition(fn)}catch(e){root.classList.remove('vt-device');fn();return}

  }
  const ph=$('.phone');if(ph){ph.classList.remove('devswap');void ph.offsetWidth;ph.classList.add('devswap')}
  fn();
}

function formErr(id,msg,inputId){const e=$('#'+id);if(e){e.textContent=msg;e.hidden=false}const i=inputId&&$('#'+inputId);if(i){i.classList.remove('err');void i.offsetWidth;i.classList.add('err');i.focus()}}

SCREENS.sop=({ro})=>`${topbar('SOP Mitra KosCare')}<div class="sec" style="max-width:640px;margin:0 auto;width:100%;padding-bottom:20px">
  <div class="cardx"><h3>Standar Operasional Prosedur Mitra</h3><p class="small muted">Versi 1.0 · berlaku untuk seluruh mitra FixCare, HandyCare, MoveCare, dan CleanCare. Tujuannya menjaga keselamatan pelanggan, kualitas layanan, dan nama baik mitra.</p></div>
  <div class="sopblk do"><h3>${ic('check')}A. Himbauan: yang wajib dilakukan</h3><ol>${SOP_DO.map(x=>`<li>${x}</li>`).join('')}</ol></div>
  <div class="sopblk dont"><h3>${ic('alert')}B. Larangan: yang tidak boleh dilakukan</h3><ol>${SOP_DONT.map(x=>`<li>${x}</li>`).join('')}</ol></div>
  <div class="sopblk"><h3>${ic('shield')}C. Sanksi bertingkat</h3><div class="sanksi">${SOP_SANKSI.map(([c,l,t,e,s])=>`<div class="sx ${c}"><div class="t">${t}<em>${l}</em></div><div><b>Contoh:</b> ${e}</div><div><b>Sanksi:</b> ${s}</div></div>`).join('')}</div></div>
  <div class="sopblk"><h3>${ic('info')}D. Pelaporan dan banding</h3><ol><li>Pelanggan dapat melapor dari menu Pesanan. Tim KosCare meninjau laporan paling lama 1x24 jam.</li><li>Selama peninjauan, pesanan terkait dapat ditahan dan mitra bisa dinonaktifkan sementara.</li><li>Mitra boleh mengajukan banding dengan bukti dalam 3 hari kerja sejak sanksi diberikan.</li></ol></div>
  <div class="sopblk"><h3>${ic('brief')}E. Pernyataan persetujuan</h3><p style="font-size:13px;line-height:1.5">Dengan menekan <b>Ya, Saya Setuju</b>, saya menyatakan telah membaca dan memahami seluruh SOP ini, bersedia mematuhinya, dan menerima sanksi sesuai ketentuan jika saya melanggar.</p></div>
  </div>
  ${ro?`<div class="sopbar"><button class="btn" data-act="back">Tutup</button></div>`:`<div class="sopbar"><div class="prog"><i id="sopProg"></i></div><small id="sopHint">Gulir sampai bawah untuk mengaktifkan persetujuan</small><div class="row2"><button class="btn ghost" data-act="sopNo">Tolak</button><button class="btn" id="sopYes" data-act="sopYes" disabled>Ya, Saya Setuju</button></div></div>`}`;
function initSop(){
  if(cur.params&&cur.params.ro)return;
  const upd=()=>{const max=view.scrollHeight-view.clientHeight,p=max<=0?1:Math.min(1,view.scrollTop/max);const bar=$('#sopProg');if(bar)bar.style.width=Math.round(p*100)+'%';
    if(p>=.97){const y=$('#sopYes');if(y&&y.disabled){y.disabled=false;const hint=$('#sopHint');if(hint)hint.textContent='Kamu sudah membaca sampai habis'}}};
  view.onscroll=upd;requestAnimationFrame(upd);
}

Object.assign(ACT,{
  atab:el=>{S.authTab=el.dataset.v;render('none')},
  mtab:el=>{S.mtab=el.dataset.v;render('none')},
  eye:el=>{const i=$('#'+el.dataset.for);if(!i)return;const show=i.type==='password';i.type=show?'text':'password';el.setAttribute('aria-pressed',String(show));el.innerHTML=ic(show?'eyeoff':'eye')},
  forgot:()=>toast('Untuk demo, pakai akun demo yang tertera','info'),
  demoLogin:()=>{doLogin({name:DEMO.name,email:DEMO.email},$('#lRem')?$('#lRem').checked:false)},
  mDemoLogin:()=>{doMLogin(null,$('#mRem')?$('#mRem').checked:false)},
  logout:()=>{S.u=null;S.mt.on=false;S.mt.me=null;try{localStorage.removeItem('koscare.auth');localStorage.removeItem('koscare.mauth')}catch(e){}S.rem=false;S.mt.rem=false;S.authTab='login';stack=[];cur={name:'login',params:{}};render('fade');toast('Kamu sudah keluar','lock')},
  mlogout:()=>{S.mt.on=false;S.mt.me=null;S.mt.rem=false;try{localStorage.removeItem('koscare.mauth')}catch(e){}S.m.lv=3;S.m.rate=10;S.m.earn=85500;S.mt.me=null;mSeed();stack=[];cur={name:'profile',params:{}};render('fade');toast('Keluar dari Mode Mitra','lock')},
  mstart:()=>{S.mreg=Object.assign({svc:[],docs:{},area:'Sekaran',exp:'Kurang dari 1 tahun'},{});nav('mreg')},
  msvc:el=>{const v=el.dataset.v,a=S.mreg.svc,i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);render('none',true)},
  mdoc:el=>{const k=el.dataset.v;S.mreg.docs[k]=!S.mreg.docs[k];render('none',true);if(S.mreg.docs[k])toast('Dokumen terunggah (simulasi)','check')},
  sopRead:()=>nav('sop',{ro:true}),
  sopRead2:()=>nav('sop',{}),
  sopYes:()=>{S.mreg.sop=true;back();toast('SOP disetujui','check')},
  sopNo:()=>{S.mreg.sop=false;back();toast('Kamu perlu menyetujui SOP untuk menjadi mitra','alert')},
  msubmit:()=>{if(!mrOK()){toast('Lengkapi semua persyaratan dulu','alert');return}
    const r=S.mreg;S.mt.pending={id:'REG-'+String(Math.floor(1000+Math.random()*8999)),name:r.name.trim(),wa:r.wa,svc:r.svc.slice(),pw:r.pw};stack=[{name:'profile',params:{}}];cur={name:'mdone',params:{}};render('enter')},
  mpass:()=>{const p=S.mt.pending;if(!p)return;const id='KC-T0'+String(40+MACCTS.length+1);const me={id,name:p.name,svc:p.svc};MACCTS.push({id,pw:p.pw,me});S.mt.me=me;S.mt.on=true;S.m.lv=1;S.m.rate=15;S.m.earn=0;S.mt.pending=null;mSeed();
    stack=[{name:'profile',params:{}}];cur={name:'mitra',params:{}};render('enter');toast('Selamat! Akunmu aktif. ID Mitra: '+id,'check')}
});
function doLogin(u,rem){S.u=u;S.rem=rem;try{if(rem)localStorage.setItem('koscare.auth',JSON.stringify({u}));else localStorage.removeItem('koscare.auth')}catch(e){}
  stack=[];cur={name:'home',params:{}};render('fade');toast('Selamat datang, '+u.name.split(' ')[0]+'!','check')}
function doMLogin(me,rem){S.mt.on=true;S.mt.me=me;S.mt.rem=rem;if(me){S.m.lv=1;S.m.rate=15;S.m.earn=0}else{S.m.lv=3;S.m.rate=10;S.m.earn=85500}mSeed();
  try{if(rem)localStorage.setItem('koscare.mauth',JSON.stringify({on:true,me}));else localStorage.removeItem('koscare.mauth')}catch(e){}
  stack=[{name:'profile',params:{}}];cur={name:'mitra',params:{}};render('enter');toast('Masuk sebagai mitra','brief')}
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;if(!f)return;
  if(f==='login'){e.preventDefault();const em=$('#lEmail').value.trim().toLowerCase(),pw=$('#lPw').value;
    if(!em)return formErr('aErr','Isi email kamu.','lEmail');if(!pw)return formErr('aErr','Isi kata sandi.','lPw');
    const acc=(em===DEMO.email&&pw===DEMO.pw)?{name:DEMO.name,email:DEMO.email}:(ACCTS.find(a=>a.email===em&&a.pw===pw)||null);
    if(!acc)return formErr('aErr','Email atau kata sandi salah. Untuk demo, pakai akun demo di bawah.','lPw');
    doLogin({name:acc.name,email:acc.email},$('#lRem').checked)}
  else if(f==='reg'){e.preventDefault();const n=$('#rName').value.trim(),em=$('#rEmail').value.trim().toLowerCase(),pw=$('#rPw').value;
    if(n.length<3)return formErr('aErr','Isi nama lengkap.','rName');if(!/^\S+@\S+\.\S+$/.test(em))return formErr('aErr','Format email belum benar.','rEmail');
    if(pw.length<6)return formErr('aErr','Kata sandi minimal 6 karakter.','rPw');if(!$('#rTos').checked)return formErr('aErr','Centang persetujuan Syarat dan Ketentuan.');
    ACCTS.push({name:n,email:em,pw});doLogin({name:n,email:em},$('#rRem').checked)}
  else if(f==='mlogin'){e.preventDefault();const id=$('#mId').value.trim().toLowerCase(),pw=$('#mPw').value;
    if(!id)return formErr('mErr','Isi ID mitra atau email.','mId');if(!pw)return formErr('mErr','Isi kata sandi.','mPw');
    if(id===MDEMO.id.toLowerCase()&&pw===MDEMO.pw)return doMLogin(null,$('#mRem').checked);
    const a=MACCTS.find(x=>x.id.toLowerCase()===id&&x.pw===pw);if(a)return doMLogin(a.me,$('#mRem').checked);
    formErr('mErr','ID atau kata sandi salah. Untuk demo, pakai akun mitra demo di bawah.','mPw')}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.mr){S.mreg[t.dataset.mr]=t.value;refreshMr()}if(t.matches&&t.matches('#lEmail,#lPw,#mId,#mPw,#rName,#rEmail,#rPw')){const m=$('#aErr')||$('#mErr');if(m)m.hidden=true;t.classList.remove('err')}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.k){S.mreg[t.dataset.k]=t.checked;refreshMr()}else if(t.dataset&&t.dataset.mr==='area'||t.dataset&&t.dataset.mr==='exp'){S.mreg[t.dataset.mr]=t.value}});

/* ================= init ================= */
function tickClock(){const c=$('#clock');if(c)c.textContent=hhmm(new Date())}
tickClock();setInterval(tickClock,20000);
if(S.dark!==null&&S.dark!==undefined){document.documentElement.dataset.theme=S.dark?'dark':'light';const b=$('#btnTheme');if(b)b.innerHTML=ic(S.dark?'sun':'moon','sm')+'<span>'+(S.dark?'Mode terang':'Mode gelap')+'</span>'}
applyDevice(false);
render('fade');
setTimeout(()=>$('#splash').classList.add('off'),1300);
window.__koscare={demo,S,get T(){return T},get cur(){return cur}};
})();

</script>
